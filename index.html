<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Ghofrane</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Cormorant+SC:wght@500&display=swap');

  :root{
    --bg: #14110f;
    --bg-deep: #0c0a09;
    --gold: #cba15c;
    --gold-soft: #a9884f;
    --cream: #efe6d8;
    --ink: #e8ddc9;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0;
    height:100%;
    background: radial-gradient(ellipse at 50% 20%, #1c1713 0%, var(--bg-deep) 70%);
    font-family: 'Cormorant Garamond', serif;
    color: var(--ink);
    overflow: hidden;
  }

  body{
    display:flex;
    align-items:center;
    justify-content:center;
    perspective: 1800px;
  }

  /* ambient floating dust/stars */
  .sparkle{
    position:fixed;
    border-radius:50%;
    background: var(--gold);
    opacity:0;
    pointer-events:none;
    animation: drift 7s ease-in-out infinite;
  }
  @keyframes drift{
    0%{ opacity:0; transform: translateY(0) scale(0.5); }
    15%{ opacity:.6; }
    85%{ opacity:.5; }
    100%{ opacity:0; transform: translateY(-60px) scale(1); }
  }

  .stage{
    position:relative;
    width: min(380px, 86vw);
    height: min(520px, 78vh);
  }

  .hint{
    position:absolute;
    bottom: -3.2rem;
    left:0; right:0;
    text-align:center;
    color: var(--gold-soft);
    font-size: 0.95rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    opacity: 0.75;
    animation: pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{ opacity:.4; }
    50%{ opacity:.85; }
  }
  .stage.opened .hint{ display:none; }

  /* ---- envelope/cover (front) ---- */
  .cover{
    position:absolute;
    inset:0;
    border-radius: 6px;
    background:
      linear-gradient(155deg, #1b1712 0%, #0f0d0b 60%, #17130f 100%);
    border: 1px solid rgba(203,161,92,0.35);
    box-shadow:
      0 30px 60px -20px rgba(0,0,0,0.7),
      inset 0 0 60px rgba(203,161,92,0.05);
    cursor: pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transform-style: preserve-3d;
    transform-origin: left center;
    transition: transform 1.1s cubic-bezier(.65,.05,.36,1);
    z-index: 5;
  }

  .cover::before{
    content:'';
    position:absolute;
    inset: 14px;
    border: 1px solid rgba(203,161,92,0.3);
    border-radius: 3px;
    pointer-events:none;
  }

  .cover-inner{
    text-align:center;
    padding: 2rem;
  }

  .monogram{
    font-family:'Cormorant SC', serif;
    font-size: 3.4rem;
    color: var(--gold);
    letter-spacing: 0.05em;
    line-height:1;
    text-shadow: 0 0 24px rgba(203,161,92,0.35);
  }

  .cover-sub{
    margin-top: 0.9rem;
    font-size: 1.05rem;
    color: var(--gold-soft);
    letter-spacing: 0.3em;
    text-transform: uppercase;
    font-style: normal;
  }

  .seal{
    margin: 1.6rem auto 0;
    width: 46px; height:46px;
    border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #d9b876, var(--gold-soft) 65%, #8a6d3b 100%);
    box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Cormorant SC', serif;
    color: #1a1510;
    font-size: 1.2rem;
  }

  .stage.opened .cover{
    transform: rotateY(-165deg);
    box-shadow: none;
  }

  /* ---- inside of card ---- */
  .inside{
    position:absolute;
    inset:0;
    border-radius: 6px;
    background: linear-gradient(170deg, #17130f, #100d0a);
    border: 1px solid rgba(203,161,92,0.22);
    padding: 2.6rem 2.2rem;
    display:flex;
    flex-direction:column;
    justify-content:center;
    z-index:1;
  }

  .inside::before{
    content:'';
    position:absolute;
    inset: 12px;
    border: 1px solid rgba(203,161,92,0.15);
    border-radius: 3px;
    pointer-events:none;
  }

  .to-line{
    font-size: 1.15rem;
    color: var(--gold-soft);
    letter-spacing: 0.08em;
    margin-bottom: 1.1rem;
    opacity:0;
    font-style: italic;
  }

  .message{
    font-size: 1.28rem;
    line-height: 1.75;
    color: var(--ink);
    opacity:0;
  }

  .signoff{
    margin-top: 1.6rem;
    font-size: 1.15rem;
    color: var(--gold);
    font-style: italic;
    opacity:0;
    text-align:right;
  }

  .stage.opened .to-line{ animation: rise 0.9s ease forwards 0.75s; }
  .stage.opened .message{ animation: rise 1s ease forwards 1.05s; }
  .stage.opened .signoff{ animation: rise 0.9s ease forwards 1.9s; }

  @keyframes rise{
    from{ opacity:0; transform: translateY(10px); }
    to{ opacity:1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce){
    .cover{ transition: none; }
    .stage.opened .to-line,
    .stage.opened .message,
    .stage.opened .signoff{ animation: none; opacity:1; }
    .sparkle{ animation: none; opacity:0; }
  }

  /* ---- photo page ---- */
  .next-arrow{
    position:absolute;
    bottom: 1rem;
    right: 1rem;
    width: 38px; height:38px;
    border-radius:50%;
    border: 1px solid rgba(203,161,92,0.4);
    background: rgba(203,161,92,0.08);
    color: var(--gold);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1.2rem;
    cursor:pointer;
    opacity:0;
    transition: opacity .4s ease, transform .3s ease, background .3s ease;
    z-index: 2;
  }
  .next-arrow:hover{ background: rgba(203,161,92,0.18); transform: translateX(2px); }
  .stage.opened .next-arrow{ animation: rise 0.8s ease forwards 2.3s; }

  .photo-page{
    position:absolute;
    inset:0;
    border-radius: 6px;
    background: linear-gradient(170deg, #17130f, #100d0a);
    border: 1px solid rgba(203,161,92,0.22);
    padding: 1.6rem;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap: 1.1rem;
    opacity:0;
    pointer-events:none;
    transform: translateX(24px);
    transition: opacity .6s ease, transform .6s ease;
    z-index: 3;
  }
  .photo-page::before{
    content:'';
    position:absolute;
    inset: 12px;
    border: 1px solid rgba(203,161,92,0.15);
    border-radius: 3px;
    pointer-events:none;
  }
  .photo-page.shown{
    opacity:1;
    pointer-events:auto;
    transform: translateX(0);
  }

  .photo-frame{
    width: 78%;
    max-width: 240px;
    border: 1px solid rgba(203,161,92,0.4);
    padding: 8px;
    background: #0c0a09;
    box-shadow: 0 20px 40px -15px rgba(0,0,0,0.7);
  }
  .photo-frame img{
    display:block;
    width:100%;
    height:auto;
    border-radius: 2px;
  }

  .photo-caption{
    font-style: italic;
    font-size: 1.15rem;
    color: var(--gold-soft);
    letter-spacing: 0.03em;
    text-align:center;
  }

  .back-arrow{
    position:absolute;
    top: 1rem;
    left: 1rem;
    width: 34px; height:34px;
    border-radius:50%;
    border: 1px solid rgba(203,161,92,0.35);
    background: rgba(203,161,92,0.06);
    color: var(--gold-soft);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1.05rem;
    cursor:pointer;
    z-index:4;
  }
</style>
</head>
<body>
